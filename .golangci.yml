version: "2"

# misspell est désactivé : il suppose des commentaires en anglais et signale
# le français du projet (« contextuel », « collecte »…) comme fautes.
linters:
  default: standard
  enable:
    - revive
    - gocritic
    - prealloc

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
