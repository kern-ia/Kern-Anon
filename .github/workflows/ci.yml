name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build
        run: go build ./...
      - name: Build (tag onnx, cgo)
        run: go build -tags onnx ./...
      - name: Test
        run: go test -race -cover ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
